上传文档
---
上传文档到知识库
tags:
  - 文档管理
consumes:
  - multipart/form-data
produces:
  - application/json
parameters:
  - in: formData
    name: file
    type: file
    required: true
    description: 文档文件
  - in: formData
    name: category
    type: string
    required: false
    description: 文档分类
    example: "技术文档"
  - in: formData
    name: tags
    type: string
    required: false
    description: 文档标签（逗号分隔）
    example: "API,开发指南"
responses:
  201:
    description: 文档上传成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            document_id:
              type: string
              example: "doc_12345"
            filename:
              type: string
              example: "api_guide.pdf"
            category:
              type: string
              example: "技术文档"
            tags:
              type: array
              items:
                type: string
              example:
                - "API"
                - "开发指南"
            chunks_count:
              type: integer
              description: 分块数量
              example: 25
            indexed_at:
              type: string
              format: date-time
              example: "2026-04-11T12:00:00Z"
        message:
          type: string
          example: "文档上传并索引成功"
  400:
    description: 请求参数错误
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "缺少必需参数"
  500:
    description: 服务器内部错误
