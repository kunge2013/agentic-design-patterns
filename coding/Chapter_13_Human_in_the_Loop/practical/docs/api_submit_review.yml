提交内容审核
---
提交内容进行审核
tags:
  - 内容审核
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    description: 审核内容
    required: true
    schema:
      type: object
      required:
        - content_type
        - content
        - source
      properties:
        content_type:
          type: string
          description: 内容类型
          example: "text"
        content:
          type: string
          description: 待审核内容文本
          example: "待审核的内容文本"
        source:
          type: string
          description: 内容来源
          example: "user_post"
        metadata:
          type: object
          description: 附加元数据
          example:
            user_id: "12345"
            timestamp: "2026-04-11T12:00:00Z"
responses:
  201:
    description: 审核提交成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            review_id:
              type: string
              example: "review_12345"
            ai_result:
              type: object
              properties:
                decision:
                  type: string
                  enum: [approve, reject, needs_review]
                  example: "needs_review"
                confidence:
                  type: number
                  example: 0.75
                risk_score:
                  type: number
                  example: 0.35
            status:
              type: string
              example: "pending_human_review"
        message:
          type: string
          example: "审核提交成功，需要人工复核"
  400:
    description: 请求参数错误
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "缺少必需参数"
  500:
    description: 服务器内部错误
